[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tibber-household-lab"
version = "0.1.0"
description = "Local-only Tibber consumption and tariff research dashboard"
requires-python = ">=3.11"
dependencies = ["tzdata>=2025.1; platform_system == 'Windows'"]

[project.optional-dependencies]
slp = ["xlrd>=2.0.1,<3"]
plots = ["matplotlib>=3.8,<4"]

[project.scripts]
tibber-local = "tibber_local.__main__:main"

[tool.setuptools.package-data]
tibber_local = ["static/*"]
